name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git for Push
        run: |
          git config --global user.email "deploy-action@github.com"
          git config --global user.name "GitHub Deploy Action"

      - name: Prepare Clean Build Directory
        run: |
          mkdir dist-deploy
          cp Dockerfile dist-deploy/
          cp .dockerignore dist-deploy/
          cp package.json dist-deploy/
          cp pnpm-workspace.yaml dist-deploy/
          cp pnpm-lock.yaml dist-deploy/
          cp README.md dist-deploy/
          cp -r backend dist-deploy/
          cp -r shared dist-deploy/
          rm -rf dist-deploy/backend/node_modules
          rm -rf dist-deploy/shared/node_modules
          rm -f dist-deploy/backend/.env

      - name: Force Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: 'yaasaf'
          HF_SPACE_NAME: 'orchids-api'
        run: |
          cd dist-deploy
          git init
          git checkout -b main
          git add .
          git commit -m "Auto-deploy from GitHub Actions: $GITHUB_SHA"
          git remote add huggingface "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME"
          git push huggingface main --force
